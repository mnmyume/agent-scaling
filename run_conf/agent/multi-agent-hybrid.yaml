name: multi-agent-hybrid
prompts:
  lead_agent:
    local_path: prompts/multi-agent/lead_agent.yaml
  subagent:
    local_path: prompts/multi-agent/subagent.yaml

agent_specific_config:
  n_base_agents: 3
  min_iterations_per_agent: 3
  max_iterations_per_agent: 3
  max_rounds: 5
  peer_rounds: 1
  peer_fanout: 1
  peer_max_iterations: 1
  task_blurb: "hybrid coordinator"
  max_execution_time: 300
  worker_timeout: 180
